<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Visualize glows when LeetCode finishes a run</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#0F0F0F}
a{color:#EDEDED}a:hover{color:#FFFFFF}
.v-btn{transition:background .12s ease}
.v-btn:hover{background:#333333 !important}
@keyframes v-ring-a{0%,100%{opacity:0}20%{opacity:.48}50%{opacity:.16}74%{opacity:.42}}
@keyframes v-soft-a{0%,100%{opacity:0}20%{opacity:.17}50%{opacity:.06}74%{opacity:.14}}
@keyframes v-dot-a{0%,100%{transform:scale(1)}45%{transform:scale(1.25)}}
.v-on-a .v-ring{animation:v-ring-a 2.6s ease-in-out}
.v-on-a .v-soft{animation:v-soft-a 2.6s ease-in-out}
.v-on-a .v-d1{transform-box:fill-box;transform-origin:center;animation:v-dot-a .55s cubic-bezier(.3,.7,.3,1) 0.15s 2}
.v-on-a .v-d2{transform-box:fill-box;transform-origin:center;animation:v-dot-a .55s cubic-bezier(.3,.7,.3,1) 0.33s 2}
.v-on-a .v-d3{transform-box:fill-box;transform-origin:center;animation:v-dot-a .55s cubic-bezier(.3,.7,.3,1) 0.51s 2}
@keyframes v-ring-b{0%,100%{opacity:0}20%{opacity:.48}50%{opacity:.16}74%{opacity:.42}}
@keyframes v-soft-b{0%,100%{opacity:0}20%{opacity:.17}50%{opacity:.06}74%{opacity:.14}}
@keyframes v-dot-b{0%,100%{transform:scale(1)}45%{transform:scale(1.25)}}
.v-on-b .v-ring{animation:v-ring-b 2.6s ease-in-out}
.v-on-b .v-soft{animation:v-soft-b 2.6s ease-in-out}
.v-on-b .v-d1{transform-box:fill-box;transform-origin:center;animation:v-dot-b .55s cubic-bezier(.3,.7,.3,1) 0.15s 2}
.v-on-b .v-d2{transform-box:fill-box;transform-origin:center;animation:v-dot-b .55s cubic-bezier(.3,.7,.3,1) 0.33s 2}
.v-on-b .v-d3{transform-box:fill-box;transform-origin:center;animation:v-dot-b .55s cubic-bezier(.3,.7,.3,1) 0.51s 2}
@keyframes v-fade{from{opacity:0}to{opacity:1}}.v-fade{animation:v-fade .25s ease}
.v-run{transition:background .12s ease}.v-run:hover{background:rgba(255,255,255,.08) !important}
@media (prefers-reduced-motion: reduce){.v-on-a *,.v-on-b *{animation:none !important}}
</style>
</helmet>
<div style="position: relative; width: 2000px; height: 1116px; overflow: hidden; background: #0F0F0F">
  <img src="/_blob/b518fc7c8a29ee1d4133190f85ea1e1a" alt="Your LeetCode problem page for Longest Palindromic Substring" style="position: absolute; left: 0; top: 0; width: 2000px; height: 1116px; display: block">
  <div aria-hidden="true" style="position: absolute; left: 1106px; top: 8px; width: 190px; height: 66px; background: #0F0F0F"></div>
  <div class="{{ wrap }}" style="position: absolute; left: 1114px; top: 16px; display: inline-flex">
    <span class="v-soft" aria-hidden="true" style="position: absolute; inset: -3px; border-radius: 15px; background: linear-gradient(90deg, #4C8DFF 0%, #4C8DFF 22%, #FFB020 42%, #FFB020 58%, #FF5B4A 80%, #FF5B4A 100%); filter: blur(9px); opacity: 0"></span>
    <span class="v-ring" aria-hidden="true" style="position: absolute; inset: -1.5px; border-radius: 13.5px; background: linear-gradient(90deg, #4C8DFF 0%, #4C8DFF 22%, #FFB020 42%, #FFB020 58%, #FF5B4A 80%, #FF5B4A 100%); opacity: 0"></span>
  <button type="button" class="v-btn" title="Visualize the selected test case in LeetScope (Alt+V)" style="position: relative; height: 50px; box-sizing: border-box; padding: 0 19px 0 14px; display: inline-flex; align-items: center; gap: 12px; border: 0; border-radius: 12px; background: #222222; color: #F5F5F5; font: 500 22px/1 -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; white-space: nowrap; cursor: pointer">
    <svg width="28" height="28" viewBox="2 2 56 56" aria-hidden="true" style="display: block; flex: none; overflow: visible"><circle cx="28" cy="28" r="19" fill="none" stroke="#F5F5F5" stroke-width="7"></circle><path d="M42 42L51 51" stroke="#F5F5F5" stroke-width="7.5" stroke-linecap="round"></path><circle class="v-d1" cx="28" cy="21" r="5" fill="#FFB020"></circle><circle class="v-d2" cx="21" cy="33" r="5" fill="#2F6BFF"></circle><circle class="v-d3" cx="35" cy="33" r="5" fill="#FF5B4A"></circle></svg>
    Visualize
  </button>
  </div>
  <button type="button" class="v-run" onClick="{{ run }}" aria-label="Run (LeetCode)" title="Run" style="position: absolute; left: 774px; top: 16px; width: 51px; height: 50px; border: 0; border-radius: 0; background: transparent; cursor: pointer"></button>
  <sc-if value="{{ busy }}" hint-placeholder-val="{{ false }}">
    <div class="v-fade" style="position: absolute; left: 1150px; top: 826px; width: 334px; height: 50px; background: #262626; display: flex; align-items: center; justify-content: center; font: 22px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; color: #8A8A8A">Running</div>
  </sc-if>
  <sc-if value="{{ done }}" hint-placeholder-val="{{ false }}">
    <div class="v-fade" style="position: absolute; left: 1150px; top: 826px; width: 334px; height: 50px; background: #262626; display: flex; align-items: center; justify-content: center; font: 600 26px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; color: #2CBB5D">Accepted</div>
  </sc-if>
  <div style="position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 10px; height: 40px; padding: 0 16px; border-radius: 20px; background: #EDEDED; color: #111111; font: 500 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; white-space: nowrap; box-shadow: 0 10px 30px rgba(0, 0, 0, .5)">Press Run in the top bar and watch Visualize</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2000,"height":1116}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { phase: 'idle', n: 0 }; }
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() {
    const { phase, n } = this.state;
    return {
      busy: phase === 'busy', done: phase === 'done',
      wrap: phase === 'done' ? (n % 2 ? 'v-on-a' : 'v-on-b') : '',
      run: () => { clearTimeout(this.t); this.setState({ phase: 'busy' }); this.t = setTimeout(() => this.setState({ phase: 'done', n: this.state.n + 1 }), 1100); },
    };
  }
}
</script>
</body>
</html>
