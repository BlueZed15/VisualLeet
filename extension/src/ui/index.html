<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VisualLeet</title>
  <link rel="stylesheet" href="../visualizer/renderer.css">
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="renderer-dark.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-play" viewBox="0 0 16 16"><path fill="currentColor" d="M4 2.8v10.4c0 .6.6.9 1.1.6l8.2-5.2a.7.7 0 0 0 0-1.2L5.1 2.2C4.6 1.9 4 2.2 4 2.8z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 16 16"><rect fill="currentColor" x="4" y="3" width="3" height="10" rx="1"/><rect fill="currentColor" x="9" y="3" width="3" height="10" rx="1"/></symbol>
    <symbol id="i-stop" viewBox="0 0 16 16"><rect fill="currentColor" x="3.5" y="3.5" width="9" height="9" rx="1.5"/></symbol>
    <symbol id="i-reset" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" d="M3 8a5 5 0 1 0 1.5-3.5M3 2.5v2.8h2.8"/></symbol>
    <symbol id="i-code" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M5.5 4.5 2 8l3.5 3.5M10.5 4.5 14 8l-3.5 3.5"/></symbol>
    <symbol id="i-flask" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" d="M6 2h4M6.7 2v4L3 13a1 1 0 0 0 .9 1.5h8.2A1 1 0 0 0 13 13L9.3 6V2"/></symbol>
    <symbol id="i-wrench" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" d="M10.5 2.2a3.5 3.5 0 0 0-4.2 4.6L2.4 10.7a1.2 1.2 0 0 0 1.7 1.7l3.9-3.9a3.5 3.5 0 0 0 4.6-4.2l-2 2-1.7-.3-.3-1.7z"/></symbol>
    <symbol id="i-keyboard" viewBox="0 0 16 16"><rect fill="none" stroke="currentColor" stroke-width="1.4" x="1.5" y="4" width="13" height="8.5" rx="1.5"/><path stroke="currentColor" stroke-width="1.4" stroke-linecap="round" d="M4.5 10h7M4.5 7h.01M7 7h.01M9.5 7h.01M12 7h.01"/></symbol>
    <symbol id="i-eye" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.5" d="M1.5 8S4 3.5 8 3.5 14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8z"/><circle fill="currentColor" cx="8" cy="8" r="2"/></symbol>
    <symbol id="i-select" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M2 3h8M2 6.5h12M2 10h6M10 9v5m-2-5h4m-4 5h4"/></symbol>
    <symbol id="i-import" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M8 2v8m-3-3 3 3 3-3M3 12.5v1h10v-1"/></symbol>
    <symbol id="i-pulse" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M1.5 8.5h3l1.5-4 3 7 1.5-3h4"/></symbol>
  </svg>

  <header class="topbar">
    <span class="logo"><span class="logo-mark" aria-hidden="true">&lt;/&gt;</span><span>Visual<b>Leet</b></span></span>
    <span class="sep" aria-hidden="true"></span>
    <button id="import-leetcode" class="btn btn-sm btn-ghost" type="button" title="Copy the code from the LeetCode editor on the page you opened VisualLeet from"><svg aria-hidden="true"><use href="#i-import"/></svg>Import from LeetCode</button>
    <button id="import-selection" class="btn btn-sm btn-ghost" type="button" title="Copy the text you have selected on that page into Solution"><svg aria-hidden="true"><use href="#i-select"/></svg>Import selection</button>
    <span id="source-tab" class="source-chip" title="Page to import from"></span>
    <span id="status" class="status" data-state="not-initialized" role="status">Not started</span>
  </header>

  <main class="workspace">
    <div class="left-col">
      <section class="panel" aria-label="Solution">
        <div class="tabs">
          <span class="tab" aria-selected="true"><svg aria-hidden="true"><use href="#i-code"/></svg>Solution</span>
          <span class="spacer"></span>
          <select id="example" class="select" aria-label="Load an example"><option value="">Load example…</option></select>
        </div>
        <textarea id="solution" class="editor" spellcheck="false" aria-label="Solution code" placeholder="Paste your Python solution here, or import it from LeetCode."></textarea>
      </section>

      <section class="panel" aria-label="Test input" data-tabs>
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" data-tab="call" aria-selected="true" type="button"><svg aria-hidden="true"><use href="#i-flask"/></svg>Test call<i class="dot" data-dot="call"></i></button>
          <button class="tab" role="tab" data-tab="setup" aria-selected="false" type="button"><svg aria-hidden="true"><use href="#i-wrench"/></svg>Setup<i class="dot" data-dot="setup"></i></button>
          <button class="tab" role="tab" data-tab="stdin" aria-selected="false" type="button"><svg aria-hidden="true"><use href="#i-keyboard"/></svg>input()<i class="dot" data-dot="inputs"></i></button>
          <span class="spacer"></span>
          <select id="helper" class="select" aria-label="Add a helper class to Setup"><option value="">+ Add helper</option></select>
        </div>
        <div class="tab-panel" data-panel="call">
          <textarea id="call" class="editor" spellcheck="false" aria-label="Test call" placeholder="print(Solution().twoSum([2, 7, 11, 15], 9))"></textarea>
        </div>
        <div class="tab-panel" data-panel="setup" hidden>
          <textarea id="setup" class="editor" spellcheck="false" aria-label="Setup code" placeholder="Imports and helper classes (ListNode, TreeNode…) that run before your solution."></textarea>
        </div>
        <div class="tab-panel" data-panel="stdin" hidden>
          <textarea id="inputs" class="editor" spellcheck="false" aria-label="Input lines, one per input() call" placeholder="One line per input() call"></textarea>
        </div>
      </section>

      <div class="actions">
        <button id="visualize" class="btn btn-run" type="button" title="Run and visualize (Ctrl+Enter)"><svg aria-hidden="true"><use href="#i-play"/></svg>Visualize<span class="kbd">Ctrl ↵</span></button>
        <button id="stop" class="btn btn-stop" type="button" disabled><svg aria-hidden="true"><use href="#i-stop"/></svg>Stop</button>
        <span class="spacer"></span>
        <button id="reset" class="btn btn-icon btn-ghost" type="button" title="Restart the Python runtime" aria-label="Restart the Python runtime"><svg aria-hidden="true"><use href="#i-reset"/></svg></button>
        <button id="diag-toggle" class="btn btn-icon btn-ghost" type="button" title="Show diagnostics" aria-label="Show diagnostics" aria-pressed="false"><svg aria-hidden="true"><use href="#i-pulse"/></svg></button>
      </div>
    </div>

    <section class="panel viz-panel" aria-label="Visualization">
      <div class="tabs">
        <span class="tab" aria-selected="true"><svg aria-hidden="true"><use href="#i-eye"/></svg>Visualizer</span>
        <span class="spacer"></span>
        <span id="player" class="player" hidden>
          <button id="play" class="btn btn-sm btn-play" type="button" title="Play through the steps (Space)" aria-pressed="false"><svg aria-hidden="true"><use href="#i-play"/></svg><span>Play</span></button>
          <select id="speed" class="select" aria-label="Playback speed" title="Playback speed">
            <option value="1100">0.5×</option><option value="550" selected>1×</option><option value="260">2×</option><option value="110">4×</option>
          </select>
        </span>
        <span id="step-meter" class="step-meter" hidden><span class="count">step <b>0</b> / <span class="total">0</span></span><span class="bar"><i></i></span></span>
      </div>
      <div class="viz-body">
        <div id="message" class="message" aria-live="polite" hidden></div>
        <div id="empty" class="placeholder" data-kind="loading">
          <div class="ph-icon" aria-hidden="true"></div>
          <div class="ph-title">Starting Python…</div>
          <div class="ph-body">Loading the bundled runtime.</div>
        </div>
        <div id="viz"></div>
        <pre id="diag" class="diag" hidden></pre>
      </div>
    </section>
  </main>

  <script src="../visualizer/renderer.js"></script>
  <script type="module" src="ui.js"></script>
</body>
</html>
